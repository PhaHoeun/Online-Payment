name: online_payment
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  alipay: ^0.1.0
  flutter_paypal_payment_checkout_v2: ^2.1.1
  gap: ^3.0.1
  flutter_dotenv: ^5.1.0
